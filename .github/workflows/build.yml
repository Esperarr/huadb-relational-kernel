name: Database engine checks

on:
  push:
    branches:
      - portfolio
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/debug \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/debug --parallel 4

      - name: Run SQL logic tests
        run: |
          rm -rf huadb_test/huadb_data
          ./build/debug/bin/sqllogictest \
            test/lab0/*.test \
            test/lab1/*.test \
            test/lab2/*.test \
            test/lab3/*.test \
            test/lab4/*.test \
            test/lab5/*.test \
            test/lab6/*.test
